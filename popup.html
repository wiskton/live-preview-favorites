<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0e0e10;
  color: #efeff1;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  width: 480px;
  min-height: 200px;
  overflow: visible;
}

/* ── Header ── */
.popup-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px 10px;
  border-bottom: 1px solid #2c2c33;
}
.popup-title {
  font-size: 13px;
  font-weight: 700;
  color: #bf94ff;
  letter-spacing: 0.5px;
}
.settings-toggle {
  background: none;
  border: 1px solid #3a3a41;
  border-radius: 4px;
  color: #adadb8;
  font-size: 14px;
  padding: 2px 7px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  line-height: 1.4;
}
.settings-toggle:hover { color: #bf94ff; border-color: #bf94ff; }

/* ── Lives columns ── */
.lives-section {
  padding: 10px 10px 6px;
}
.columns {
  display: flex;
  gap: 8px;
}
.column {
  flex: 1;
  min-width: 0;
}
.col-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px 6px;
  border-bottom: 2px solid transparent;
}
.col-header.twitch { border-color: #9147ff; }
.col-header.kick   { border-color: #53fc18; }

.col-logo {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.col-logo.twitch { color: #9147ff; }
.col-logo.kick   { color: #53fc18; }

.col-count {
  font-size: 10px;
  color: #adadb8;
  margin-left: auto;
}

.channel-list {
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.channel-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 6px;
  border-radius: 6px;
  text-decoration: none;
  color: #efeff1;
  transition: background 0.12s, box-shadow 0.12s, opacity 0.12s;
  cursor: grab;
  user-select: none;
}
.channel-item:hover { background: rgba(255,255,255,0.07); }
.channel-item.dragging { opacity: 0.4; cursor: grabbing; }
.channel-item.drag-over { box-shadow: inset 0 2px 0 0 #9147ff; background: rgba(145,71,255,0.10); }
.channel-item.drag-over.kick-col { box-shadow: inset 0 2px 0 0 #53fc18; background: rgba(83,252,24,0.08); }

.drag-handle {
  font-size: 13px;
  color: rgba(255,255,255,0.25);
  flex-shrink: 0;
  cursor: grab;
  line-height: 1;
  transition: color 0.12s;
  padding: 0 2px;
}
.channel-item:hover .drag-handle { color: rgba(255,255,255,0.55); }

.channel-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

.channel-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.channel-name {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.channel-meta {
  font-size: 11px;
  color: #adadb8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.live-dot {
  width: 6px;
  height: 6px;
  background: #ff0000;
  border-radius: 50%;
  flex-shrink: 0;
}
.viewers-text {
  font-size: 11px;
  color: #adadb8;
  white-space: nowrap;
  flex-shrink: 0;
}

.empty-col {
  padding: 14px 6px;
  font-size: 11px;
  color: #53535f;
  text-align: center;
}

.loading-col {
  padding: 14px 6px;
  font-size: 11px;
  color: #53535f;
  text-align: center;
}

/* ── Settings panel ── */
.settings-panel {
  border-top: 1px solid #2c2c33;
  padding: 12px 14px;
  display: none;
}
.settings-panel.open { display: block; }

.settings-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.settings-row input[type="checkbox"] {
  cursor: pointer;
  width: 14px;
  height: 14px;
  accent-color: #9147ff;
}
.settings-row label {
  font-size: 12px;
  cursor: pointer;
  color: #efeff1;
}

/* ── Support ── */
.support-section {
  border-top: 1px solid #2c2c33;
  padding: 10px 14px 12px;
  text-align: center;
}
.support-title { font-size: 12px; margin-bottom: 4px; }
.support-text  { font-size: 11px; color: #adadb8; margin-bottom: 6px; }
.btc-box {
  background: #18181b;
  border: 1px solid #34343a;
  border-radius: 4px;
  padding: 5px 8px;
  font-family: monospace;
  font-size: 10px;
  word-break: break-all;
  margin-bottom: 8px;
  cursor: pointer;
  color: #efeff1;
}
.btc-box:hover { border-color: #9147ff; }
.follow-label { font-size: 11px; color: #adadb8; margin-bottom: 4px; }
.social-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 6px; }
.social-row a { color: #bf94ff; font-size: 11px; text-decoration: none; }
.social-row a:hover { text-decoration: underline; }
.credit { font-size: 10px; color: #53535f; }
</style>
</head>
<body>

<!-- Header -->
<div class="popup-header">
  <span class="popup-title" data-i18n="favoritesLabel">FAVORITOS</span>
  <button type="button" class="settings-toggle" id="settingsToggle">⚙</button>
</div>

<!-- Lives -->
<div class="lives-section">
  <div class="columns">

    <!-- Twitch -->
    <div class="column">
      <div class="col-header twitch">
        <span class="col-logo twitch">TWITCH</span>
        <span class="col-count" id="twitch-count"></span>
      </div>
      <div class="channel-list" id="twitch-list">
        <div class="loading-col" id="twitch-loading">...</div>
      </div>
    </div>

    <!-- Kick -->
    <div class="column">
      <div class="col-header kick">
        <span class="col-logo kick">KICK</span>
        <span class="col-count" id="kick-count"></span>
      </div>
      <div class="channel-list" id="kick-list">
        <div class="loading-col" id="kick-loading">...</div>
      </div>
    </div>

  </div>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-row">
    <input type="checkbox" id="mixPlatforms">
    <label for="mixPlatforms" data-i18n="popupMixPlatforms">Mix favorites (Twitch & Kick)</label>
  </div>
</div>

<!-- Support -->
<div class="support-section">
  <p class="support-title" data-i18n="popupEnjoying">Enjoying this extension? ❤️</p>
  <p class="support-text" data-i18n="popupDonateText">You can support by donating Bitcoin:</p>
  <div class="btc-box" id="btcBox">bc1qmzde7n8xm45c03wjsf4nwjsx4p67ynugem9dr4</div>
  <p class="follow-label" data-i18n="popupFollowMe">Follow me</p>
  <div class="social-row">
    <a href="https://x.com/wiskton" target="_blank">X</a>
    <a href="https://twitch.tv/wiskton" target="_blank">Twitch</a>
    <a href="https://kick.com/wiskton" target="_blank">Kick</a>
  </div>
  <p class="credit" data-i18n="popupDevelopedBy">Developed by wiskton</p>
</div>

<script src="popup.js"></script>
</body>
</html>
